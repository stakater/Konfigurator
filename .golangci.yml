# golangci-lint v2 config (H.7). Pinned version: see GOLANGCI_LINT_VERSION in the Makefile.
version: "2"

linters:
  default: standard # errcheck, govet, ineffassign, staticcheck, unused

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/stakater/konfigurator
  exclusions:
    # Never reformat generated code: controller-gen owns it (make codegen-check).
    paths:
      - zz_generated\..*\.go$
