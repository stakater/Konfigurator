name: Push

on:
  push:
    branches:
      - master

jobs:
  push-container:
    name: Push Container
    # Shared Stakater workflow (H.9, docs/releasing.md): derives the next tag from the
    # existing git tags, builds and pushes ghcr.io/stakater/konfigurator:<tag>, then
    # pushes the tag. Nothing is committed back to master. Verification runs in
    # pull_request.yml before merge; chart releases run in release-helm.yml.
    uses: stakater/.github/.github/workflows/push_container.yaml@main
    secrets:
      CONTAINER_REGISTRY_URL: ghcr.io/stakater
      CONTAINER_REGISTRY_USERNAME: stakater-user
      CONTAINER_REGISTRY_PASSWORD: ${{ secrets.GHCR_TOKEN }}
      SLACK_WEBHOOK_URL: ${{ secrets.STAKATER_DELIVERY_SLACK_WEBHOOK }}
      GH_TOKEN: ${{ secrets.PUBLISH_TOKEN }}
    with:
      DOCKER_FILE_PATH: Dockerfile
      RELEASE_BRANCH: master
