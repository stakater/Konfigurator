deployCRD: false


labels:
  provider: stakater
  group: com.stakater.platform
  version: v0.1.2
env:
- name: WATCH_NAMESPACE
  valueFrom:
    fieldRef:
      fieldPath: metadata.namespace
replicaCount: 1

# Hosts a KonfiguratorTemplate's spec.validationWebhookURL may call. A bare host
# (my-validator.my-ns.svc) allows any port on that host; host:port
# (my-validator.my-ns.svc:8443) allows only that port. Empty = validation
# webhooks disabled: templates that set validationWebhookURL fail to render.
# Set by the cluster admin, never by template authors (SSRF protection).
validationWebhook:
  allowedHosts: []

image:
  repository: stakater/konfigurator
  tag:  v0.1.39
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name:

podSecurityContext: {}

securityContext: {}

resources: {}
  # limits:
  #   cpu: 100m
  #   memory: 128Mi
  # requests:
  #   cpu: 100m
#   memory: 128Mi

nodeSelector: {}

tolerations: []

affinity: {}
